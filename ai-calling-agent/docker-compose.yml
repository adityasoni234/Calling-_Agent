name: calling-agent

services:
  postgres:
    container_name: calling-agent-postgres
    # pgvector is needed from Phase 6; the extension is created by migration 0001
    # so the database is ready before the RAG work lands.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-calling_agent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-calling_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: calling-agent-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    container_name: calling-agent-backend
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-calling_agent}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Bind mount + --reload for local development. Drop both in production.
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    container_name: calling-agent-worker
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-calling_agent}
      REDIS_URL: redis://redis:6379/0
      # The API container owns migrations; the worker must not race it.
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend/app:/app/app
    command: ["arq", "app.tasks.worker.WorkerSettings"]
    # The image's healthcheck probes the HTTP port, which the worker doesn't serve.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    container_name: calling-agent-frontend
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      # Read by the browser, so it must be the host-visible URL, not the service name.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/admin.html:/app/admin.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/vite.admin.config.ts:/app/vite.admin.config.ts
      # Mounted too, or the container keeps whatever was baked into the image
      # at build time. A stale Tailwind config fails the whole stylesheet --
      # every page then loads unstyled with an "unknown class" overlay.
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
